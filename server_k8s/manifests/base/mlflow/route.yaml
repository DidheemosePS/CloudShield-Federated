apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mlflow-route
spec:
  parentRefs:
    - name: cloudshield-gateway
      sectionName: https-mlflow
  rules:
    - backendRefs:
        - name: mlflow-service
          kind: Service
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
