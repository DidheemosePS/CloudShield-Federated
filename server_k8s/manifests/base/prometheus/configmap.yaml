apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
data:
  prometheus.yaml: |
    global:
      scrape_interval: 10s
      scrape_timeout: 5s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: prediction-api
        static_configs:
          - targets: ["prediction-api-service:3000"]
        metrics_path: /metrics
        scheme: http
