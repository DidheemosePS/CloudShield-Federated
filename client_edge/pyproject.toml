[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "client_edge"
version = "1.0.0"
description = "Edge client training runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
    "shared",
    "flwr",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]