[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared"
version = "1.0.0"
description = "Shared models and utilities for Fraud Detection FL"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "polars",
    "scikit-learn",
    "pyarrow",
    "protobuf",
]

[tool.hatch.build.targets.wheel]
packages = ["fraud_detection_fl"]