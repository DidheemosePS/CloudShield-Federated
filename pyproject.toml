[project]
name = "cloudshield-federated"
version = "1.0.0"
description = "Root workspace orchestration"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "shared",
    "server_k8s",
    "client_edge",
]

[tool.uv.sources]
shared = { workspace = true }
server_k8s = { workspace = true }
client_edge = { workspace = true }

[tool.uv.workspace]
members = ["shared", "server_k8s", "client_edge"]

[tool.flwr.app]
publisher = "cloudshield-federated"

[tool.flwr.app.pack]
packages = [
    "server_k8s",
    "client_edge",
    "shared"
]
exclude = [
    ".venv",
    "__pycache__",
    "*.pyc",
    "*.git*",
    "**/data/**",
    "**/mlflow_data/**",
]

[tool.flwr.app.components]
serverapp = "server_k8s.app.server_app:app"
clientapp = "client_edge.app.client_app:app"